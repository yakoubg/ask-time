<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علا قداه نقراو غدوا؟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #e2e8f0;
            --secondary-text: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --secondary: #334155;
                --secondary-text: #f1f5f9;
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 450px;
            width: 100%;
            transition: transform 0.2s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }

        .btn-share {
            background-color: var(--secondary);
            color: var(--secondary-text);
        }

        .btn-share:hover {
            opacity: 0.9;
        }

        .toast {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #10b981;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="message">علا قداه نقراو غدوا</h1>
        
        <div class="buttons">
            <button class="btn-copy" onclick="copyText()">نسخ الرسالة</button>
            <button class="btn-share" onclick="shareText()">مشاركة</button>
        </div>

        <div id="toast" class="toast">تم نسخ الرسالة بنجاح!</div>
    </div>

    <script>
        const messageText = document.getElementById('message').innerText;

        function copyText() {
            navigator.clipboard.writeText(messageText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        function shareText() {
            if (navigator.share) {
                navigator.share({
                    title: 'سؤال عن التوقيت',
                    text: messageText,
                    url: window.location.href
                });
            } else {
                copyText();
            }
        }
    </script>

</body>
</html>
